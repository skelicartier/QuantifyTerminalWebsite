  <style>
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/Public/fonts/poppins-latin-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/Public/fonts/poppins-latin-700.woff2") format("woff2");
    }
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #9aa0ab;
      --brand: #9810fa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .mark {
      font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }
    .mark span { color: var(--brand); font-weight: 700; }
    .cta {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .cta:hover { border-color: var(--text); }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 0 20px;
    }
    .frame {
      position: relative;
      width: min(100%, calc((100dvh - 132px) * 16 / 9));
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #000000;
    }
    .sound {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 16px;
      border: 0;
      background: #ffffff;
      color: #000000;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    .sound[hidden] { display: none; }
    .sound svg { width: 16px; height: 16px; }
    .note {
      margin: 0;
      padding: 12px 20px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
    @media (max-width: 420px) {
      .bar { padding: 12px 16px; }
      .mark { font-size: 19px; }
      .cta { padding: 0 12px; font-size: 13px; }
      .stage { padding: 0; }
    }

<body>
  <header class="bar">
    <a class="mark" href="/" aria-label="Quantify Terminal home">quantify terminal<span>.</span></a>
    <a class="cta" href="/early-access">Request early access</a>
  </header>

  <main class="stage">
    <div class="frame">
      <video id="film" controls playsinline preload="auto" width="1920" height="1080"
             poster="/Public/video/quantify-terminal-overnight-demo-poster.jpg?v=4"
             aria-label="Quantify Terminal in three minutes: the overnight brief">
        <source src="/Public/video/quantify-terminal-overnight-demo.mp4?v=5" type="video/mp4">
        Your browser cannot play this video. <a href="/Public/video/quantify-terminal-overnight-demo.mp4?v=5">Download it instead.</a>
      </video>
      <button class="sound" id="sound" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        Turn on sound
      </button>
    </div>
  </main>

  <p class="note">Recorded on a demonstration account &mdash; the companies and their reported figures are real; the book, its beliefs and its decisions were written for the film.</p>

  <script>
    (function () {
      var film = document.getElementById('film');
      var sound = document.getElementById('sound');
      if (!film || !sound) return;

      // Start the film as soon as the page opens. Browsers refuse to start a film with sound
      // until the viewer has touched the page, so when that is refused it starts muted and
      // the button offers the sound.
      function startMuted() {
        film.muted = true;
        var retry = film.play();
        if (retry && retry.catch) retry.catch(function () {});
        sound.hidden = false;
      }
      film.muted = false;
      var attempt = film.play();
      if (attempt && attempt.catch) attempt.catch(startMuted);

      sound.addEventListener('click', function () {
        // Someone who has only just arrived hears it from the top; someone further in keeps their place.
        if (film.currentTime < 15) film.currentTime = 0;
        film.muted = false;
        var resumed = film.play();
        if (resumed && resumed.catch) resumed.catch(function () {});
        sound.hidden = true;
      });
      film.addEventListener('volumechange', function () {
        if (!film.muted) sound.hidden = true;
      });
    })();
  </script>
</body>
